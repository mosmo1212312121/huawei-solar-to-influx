services:
  huawei-solar-to-influx:
    image: ghcr.io/mosmo1212312121/huawei-solar-to-influx:latest
    container_name: huawei-solar-to-influx
    networks:
      - solar-monitor
    env_file:
      - .env
    depends_on:
      - influxdb
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    networks:
      - solar-monitor
    ports:
      - "8086:8086"
    volumes:
      - ./data/influxdb:/var/lib/influxdb
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - solar-monitor
    ports:
      - "3000:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
    depends_on:
      - influxdb
networks:
  solar-monitor:
    driver: bridge
